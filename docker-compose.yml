version: '3.8'

services:

  # Contenedor de PostgreSQL
  db:
    image: postgres:16
    container_name: heierling_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      # Carpeta donde PostgreSQL ejecuta los SQL al arrancar
      - ./sql:/docker-entrypoint-initdb.d
      # Volumen para persistir los datos aunque el contenedor se detenga
      - heierling_data:/var/lib/postgresql/data

  # Contenedor de Python
  app:
    build: .
    container_name: heierling_app
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      # Montar la carpeta python dentro del contenedor
      - ./python:/app
    stdin_open: true
    tty: true

volumes:
  heierling_data:
